name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.1"
        required: true
        default: "v1.0.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller reportlab beautifulsoup4 pillow
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name SCORM2PDF --add-data "fonts;fonts" scorm2pdf_gui.py
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name SCORM2PDF --add-data "fonts:fonts" scorm2pdf_gui.py
          ditto -c -k --keepParent dist/SCORM2PDF.app dist/SCORM2PDF_macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SCORM2PDF_${{ matrix.label }}
          path: |
            dist/SCORM2PDF.exe
            dist/SCORM2PDF_macos.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: SCORM2PDF ${{ inputs.version }}
          body: |
            Desktop app that rebuilds a SCORM or IMS Common Cartridge course (.imscc, .zip) as a single PDF.

            Downloads
            - Windows: SCORM2PDF.exe
            - macOS (Apple Silicon): SCORM2PDF_macos.zip

            First launch warnings (the apps are not code signed)
            - Windows: if SmartScreen says "Windows protected your PC", click More info, then Run anyway.
            - macOS: unzip, right click SCORM2PDF, choose Open, then confirm Open.
          files: |
            release_files/SCORM2PDF.exe
            release_files/SCORM2PDF_macos.zip
