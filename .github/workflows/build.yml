name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller reportlab beautifulsoup4 pillow
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name SCORM2PDF --add-data "fonts;fonts" scorm2pdf_gui.py
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name SCORM2PDF --add-data "fonts:fonts" scorm2pdf_gui.py
          ditto -c -k --keepParent dist/SCORM2PDF.app dist/SCORM2PDF_macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SCORM2PDF_${{ matrix.label }}
          path: |
            dist/SCORM2PDF.exe
            dist/SCORM2PDF_macos.zip
